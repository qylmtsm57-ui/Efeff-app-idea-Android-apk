name: Build FreshStock Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Flet
        run: |
          pip install --upgrade "flet>=0.86,<0.87"
          flet --version

      - name: Generate Android project
        run: |
          flet build apk \
            --python-version 3.13 \
            --yes \
            --no-rich-output \
            --verbose

      - name: Patch Android Gradle configuration
        shell: bash
        run: |
          set -e

          GRADLE_FILE="build/flutter/android/app/build.gradle.kts"

          echo "Checking Gradle file..."

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle file was not generated:"
            echo "$GRADLE_FILE"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("build/flutter/android/app/build.gradle.kts")

          text = path.read_text(encoding="utf-8")

          # -------------------------------------------------
          # Enable Core Library Desugaring
          # -------------------------------------------------

          if "isCoreLibraryDesugaringEnabled = true" not in text:

              if "compileOptions {" not in text:
                  raise SystemExit(
                      "ERROR: compileOptions block not found."
                  )

              text = text.replace(
                  "compileOptions {",
                  """compileOptions {
                      isCoreLibraryDesugaringEnabled = true""",
                  1,
              )

          # -------------------------------------------------
          # Add desugar_jdk_libs dependency
          # -------------------------------------------------

          dependency = (
              'coreLibraryDesugaring("'
              'com.android.tools:desugar_jdk_libs:2.1.4'
              '")'
          )

          if "com.android.tools:desugar_jdk_libs" not in text:

              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      f"""dependencies {{
                      {dependency}""",
                      1,
                  )
              else:
                  text += f"""

          dependencies {{
              {dependency}
          }}
          """

          path.write_text(text, encoding="utf-8")

          print("")
          print("==========================================")
          print("Gradle configuration after patch")
          print("==========================================")
          print(path.read_text(encoding="utf-8"))

          PY

      - name: Patch Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="build/flutter/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "WARNING: AndroidManifest.xml was not found."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path(
              "build/flutter/android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(encoding="utf-8")

          receiver = """
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />

              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """

          if "ScheduledNotificationReceiver" not in text:

              if "</application>" not in text:
                  raise SystemExit(
                      "ERROR: </application> not found."
                  )

              text = text.replace(
                  "</application>",
                  receiver + "\n</application>",
                  1,
              )

              path.write_text(text, encoding="utf-8")

              print("Notification receivers added.")

          else:
              print("Notification receivers already exist.")

          PY

      - name: Verify Android configuration
        run: |
          echo "=========================================="
          echo "Android project"
          echo "=========================================="

          test -f build/flutter/android/app/build.gradle.kts
          test -f build/flutter/android/app/src/main/AndroidManifest.xml

          echo "Gradle:"
          grep -n "isCoreLibraryDesugaringEnabled" \
            build/flutter/android/app/build.gradle.kts || true

          echo "Desugaring:"
          grep -n "desugar_jdk_libs" \
            build/flutter/android/app/build.gradle.kts || true

      - name: Build final APK
        run: |
          flet build apk \
            --python-version 3.13 \
            --yes \
            --no-rich-output \
            --verbose

      - name: Show generated APK
        run: |
          echo "=========================================="
          echo "Generated APK files"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreshStock-APK
          path: |
            build/apk/*.apk
          if-no-files-found: error
