name: Build FreshStock Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Flet
        run: |
          pip install "flet>=0.86.0"

      - name: Build Android APK
        run: |
          flet build apk \
            --yes \
            --verbose \
            --no-rich-output

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreshStock-APK
          path: build/apk/*.apk
          if-no-files-found: error
